name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        # Lean install: core + ml + dev only. Unit tests need torch + cv2 but nothing
        # from the tracking group, so CI skips the heavyweights.
        run: uv sync --locked --no-default-groups --group ml --group dev

      - name: Lint
        run: uv run ruff check src scripts tests

      - name: Format check
        run: uv run ruff format --check src scripts tests

      # Unit tests only — synthetic fixtures, no footage or model weights (both are git-ignored).
      - name: Test
        run: uv run pytest
